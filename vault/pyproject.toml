[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muster-vault"
version = "0.1.0"
description = "MUSTER Vault: tamper-evident records for fitness scoring, attendance, and arms-room accountability"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "sqlcipher3-wheels>=0.5.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
muster-vault = "muster_vault.cli:main"

[tool.setuptools]
packages = ["muster_vault"]

[tool.setuptools.package-data]
muster_vault = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
