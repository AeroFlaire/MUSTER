<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSTER Mobile Grader - AFT Flow</title>
    <!-- ZXing Library for reliable Code 39 1D CAC Barcode Scanning -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f4f4f9; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-submit { background: #0056b3; color: white; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-scan { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        #scanner-wrapper { display: none; position: relative; width: 100%; max-width: 500px; margin: 0 auto 15px auto; border: 3px solid #0056b3; background: black; border-radius: 6px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        #target-line { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: red; box-shadow: 0 0 8px red; z-index: 10; }
        .response-box { margin-top: 20px; padding: 15px; background: #222; color: #0f0; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 350px; overflow-y: auto; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>MUSTER Grader Station (AFT)</h2>

    <!-- Camera Viewfinder -->
    <div id="scanner-wrapper">
        <video id="video"></video>
        <div id="target-line"></div>
    </div>

    <form id="fitnessForm">
        <div class="form-group">
            <label for="session_id">Session ID</label>
            <input type="number" id="session_id" required value="7">
        </div>

        <div class="form-group">
            <label for="barcode">CAC Barcode (Code 39)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="barcode" required placeholder="Scan or enter barcode..." value="PDF417_TEST_DATA_9000000001_END">
                <button type="button" id="scanBtn" class="btn-scan" onclick="toggleScanner()">Scan CAC</button>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="form-group"><label for="mdl_lbs">MDL (lbs)</label><input type="text" id="mdl_lbs" value="340"></div>
            <div class="form-group"><label for="hrp_reps">HRP (reps)</label><input type="text" id="hrp_reps" value="60"></div>
            <div class="form-group"><label for="sdc_time">SDC (time)</label><input type="text" id="sdc_time" value="1:30"></div>
            <div class="form-group"><label for="plank_time">PLK (time)</label><input type="text" id="plank_time" value="3:40"></div>
            <div class="form-group"><label for="twomr_time">2MR (time)</label><input type="text" id="twomr_time" value="13:15"></div>
        </div>
        
        <button type="submit" class="btn-submit">Submit AFT Scorecard</button>
    </form>

    <div id="apiResponse" class="response-box" style="display: none;"></div>
</div>

<script>
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_39]);
    const codeReader = new ZXing.BrowserMultiFormatReader(hints);
    let scannerRunning = false;

    function toggleScanner() {
        const wrapper = document.getElementById('scanner-wrapper');
        const btn = document.getElementById('scanBtn');

        if (!scannerRunning) {
            wrapper.style.display = 'block';
            btn.textContent = 'Stop';
            btn.style.background = '#dc3545';
            scannerRunning = true;

            codeReader.listVideoInputDevices().then((devices) => {
                if (devices.length === 0) {
                    logOutput("[CAMERA ERROR] No camera hardware detected.");
                    stopScanner();
                    return;
                }
                const rearCam = devices[devices.length - 1].deviceId;
                codeReader.decodeFromVideoDevice(rearCam, 'video', (result, err) => {
                    if (result) {
                        document.getElementById('barcode').value = result.text;
                        logOutput(`[SCAN SUCCESS] Captured Code 39: ${result.text}`);
                        stopScanner();
                    }
                });
            }).catch(err => {
                logOutput(`[CAMERA ERROR] ${err}`);
                stopScanner();
            });
        } else {
            stopScanner();
        }
    }

    function stopScanner() {
        codeReader.reset();
        scannerRunning = false;
        document.getElementById('scanner-wrapper').style.display = 'none';
        const btn = document.getElementById('scanBtn');
        btn.textContent = 'Scan CAC';
        btn.style.background = '#28a745';
    }

    function logOutput(msg) {
        const box = document.getElementById('apiResponse');
        box.style.display = 'block';
        box.textContent += msg + '\n\n';
        box.scrollTop = box.scrollHeight;
    }

    async function apiCall(endpoint, method = 'POST', body = null) {
        logOutput(`>>> ${method} ${endpoint}`);
        
        const response = await fetch(endpoint, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-Contract-Version': 'v0'
            },
            body: body ? JSON.stringify(body) : null
        });

        const data = await response.json();
        logOutput(`<<< ${response.status} ${response.statusText}\n${JSON.stringify(data, null, 2)}`);
        
        if (!response.ok) throw new Error(`API halted on ${response.status}`);
        return data;
    }

    document.getElementById('fitnessForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        document.getElementById('apiResponse').textContent = '';
        
        const sessionId = document.getElementById('session_id').value;
        const barcode = document.getElementById('barcode').value;

        try {
            const openRes = await apiCall(`/v0/sessions/${sessionId}/events`, 'POST', { barcode: barcode });
            const eventId = openRes.event_id;

            const components = [
                { id: 'mdl_lbs', code: 'MDL' },
                { id: 'hrp_reps', code: 'HRP' },
                { id: 'sdc_time', code: 'SDC' },
                { id: 'plank_time', code: 'PLK' },
                { id: 'twomr_time', code: '2MR' }
            ];

            for (const comp of components) {
                const val = document.getElementById(comp.id).value;
                await apiCall(`/v0/events/${eventId}/components`, 'POST', {
                    component: comp.code,
                    raw_value: val,
                    points: 100
                });
            }

            await apiCall(`/v0/events/${eventId}/submit`, 'POST');
            logOutput("--- Scorecard Submitted Successfully ---");

        } catch (error) {
            logOutput(`[FLOW ABORTED] ${error.message}`);
        }
    });
</script>
</body>
</html>
